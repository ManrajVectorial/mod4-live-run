# Tool configuration only. Dependencies are pinned in requirements*.txt, so no build
# backend (and no extra library) is needed to install them.

[project]
name = "policy-assistant-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and fake secrets to prove real ones never leak.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
