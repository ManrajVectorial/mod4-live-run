name: CI

on:
  pull_request:
  push:
    branches: [work/build]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: scope check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Make sure the plan-approved tag is present
        run: git fetch --force --tags origin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the scope check (throwaway repo)
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q -p no:cacheprovider ci/tests/test_check_scope.py
      - name: Scope check against the plan-approved tag (falls back to the base branch)
        run: python ci/check_scope.py --base origin/${{ github.base_ref || 'main' }}

  backend:
    name: backend tests, ruff, bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Bandit
        run: bandit -q -r app
      - name: Tests
        run: python -m pytest -q

  licences:
    name: licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Licence check tests
        run: python -m pytest -q -p no:cacheprovider ci/tests/test_check_licences.py
      - name: No copyleft licences
        run: python ci/check_licences.py --node-modules frontend/node_modules

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  gate:
    name: gate
    if: always()
    needs: [scope, backend, licences, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: $RESULTS"
          if echo "$RESULTS" | grep -qvE '^\s*(\[|\]|"success",?)\s*$'; then
            echo "gate: at least one check did not succeed"
            exit 1
          fi
          echo "gate: all checks passed"
